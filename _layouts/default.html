<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} — Resetly</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<!--
  A legal document is a reading surface, so this page is typography and
  nothing else: no framework, no fonts fetched from a third party, no
  analytics and no cookies. A privacy policy that loads a tracker to be read
  would be its own contradiction, and the store reviewer who opens this page
  is checking exactly that kind of consistency.
-->
<style>
  :root {
    --ink: #22201d;
    --ink-soft: #57534e;
    --ink-faint: #8a837c;
    --ground: #faf8f5;
    --panel: #ffffff;
    --hairline: #e5e0d9;
    --accent: #3f5a52;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #ece7e0;
      --ink-soft: #b5aea6;
      --ink-faint: #8a837c;
      --ground: #171614;
      --panel: #1e1d1a;
      --hairline: #34312d;
      --accent: #8fb3a6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 17px/1.65 ui-serif, Georgia, "Times New Roman", serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 42rem; margin: 0 auto; padding: 3rem 1.25rem 5rem; }
  nav {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: .8rem; letter-spacing: .08em; text-transform: uppercase;
    padding-bottom: 1.5rem; margin-bottom: 2.5rem;
    border-bottom: 1px solid var(--hairline);
  }
  nav a { color: var(--ink-faint); text-decoration: none; margin-right: 1.25rem; }
  nav a:hover, nav a:focus { color: var(--accent); text-decoration: underline; }
  nav a[aria-current="page"] { color: var(--ink); }
  h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 .5rem; font-weight: 600; }
  h2 {
    font-size: 1.25rem; font-weight: 600; margin: 2.75rem 0 .75rem;
    padding-top: 1.25rem; border-top: 1px solid var(--hairline);
  }
  h3 { font-size: 1.05rem; font-weight: 600; margin: 1.75rem 0 .5rem; }
  p, li { color: var(--ink-soft); }
  a { color: var(--accent); }
  strong { color: var(--ink); font-weight: 600; }
  code {
    font: .85em ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--panel); border: 1px solid var(--hairline);
    border-radius: 3px; padding: .1em .35em;
  }
  blockquote {
    margin: 1.5rem 0; padding: 1rem 1.25rem;
    background: var(--panel); border-left: 3px solid var(--hairline);
    font-size: .93rem;
  }
  blockquote p:first-child { margin-top: 0; }
  blockquote p:last-child { margin-bottom: 0; }
  /* Wide tables scroll inside their own box; the page never scrolls sideways. */
  .table-scroll { overflow-x: auto; margin: 1.5rem 0; }
  table { border-collapse: collapse; width: 100%; font-size: .88rem; }
  th, td {
    text-align: left; padding: .55rem .7rem;
    border-bottom: 1px solid var(--hairline); vertical-align: top;
  }
  th { font-weight: 600; color: var(--ink); white-space: nowrap; }
  footer {
    margin-top: 4rem; padding-top: 1.5rem; border-top: 1px solid var(--hairline);
    font-size: .85rem; color: var(--ink-faint);
  }
  footer a { color: var(--ink-faint); }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Resetly</a>
    <a href="{{ '/privacy' | relative_url }}"{% if page.url contains 'privacy' %} aria-current="page"{% endif %}>Privacy</a>
    <a href="{{ '/terms' | relative_url }}"{% if page.url contains 'terms' %} aria-current="page"{% endif %}>Terms</a>
    <a href="{{ '/gizlilik' | relative_url }}"{% if page.url contains 'gizlilik' %} aria-current="page"{% endif %}>Gizlilik (TR)</a>
    <a href="{{ '/sartlar' | relative_url }}"{% if page.url contains 'sartlar' %} aria-current="page"{% endif %}>Şartlar (TR)</a>
  </nav>
  {{ content }}
  <footer>
    <p>Resetly · Hatice Ertuğrul · <a href="mailto:haticeerciyes_7@hotmail.com">haticeerciyes_7@hotmail.com</a></p>
  </footer>
</div>
<script>
  // Markdown tables are wrapped so a wide table scrolls in its own box rather
  // than forcing the whole page sideways on a phone. Done here rather than in
  // the Markdown because kramdown has no hook for it.
  document.querySelectorAll('table').forEach(function (t) {
    var box = document.createElement('div');
    box.className = 'table-scroll';
    t.parentNode.insertBefore(box, t);
    box.appendChild(t);
  });
</script>
</body>
</html>
